name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      comfyui: ${{ steps.filter.outputs.comfyui }}
      backup: ${{ steps.filter.outputs.backup }}
      upgrade: ${{ steps.filter.outputs.upgrade }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            comfyui:
              - 'apps/server/src/comfyui/**'
              - 'apps/server/src/backends/client.ts'
              - 'apps/fake-comfyui/**'
              - 'docs/ops/backend-kit.md'
            backup:
              - 'ops/backup/**'
              - 'apps/server/src/storage/check-storage.ts'
              - 'docker-compose.yml'
              - 'Dockerfile'
              - 'docs/ops/backup.md'
            # Issue #82: whatever changes the way an installed studio's
            # database, env or /data are read — the upgrade check reboots
            # a seeded previous release under the candidate image.
            upgrade:
              - 'Dockerfile'
              - 'docker-compose.yml'
              - '.env.example'
              - 'apps/server/src/db/**'
              - 'apps/server/drizzle/**'
              - 'apps/server/src/env.ts'
              - 'apps/server/src/storage/**'
              - 'apps/server/src/index.ts'
              - 'apps/server/src/auth/mock-issuer.ts'
              - 'apps/fake-comfyui/**'
              - 'scripts/upgrade-check.sh'
              - 'scripts/seed.ts'

  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_content_studio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/ai_content_studio
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install ffmpeg (Asset finishing, issue #45)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      # Pinned to the same version/checksum as the Dockerfile's `c2patool` stage.
      - name: Install c2patool (C2PA signing, issue #75)
        run: |
          curl -fsSL -o /tmp/c2patool.tar.gz \
            "https://github.com/contentauth/c2pa-rs/releases/download/c2patool-v0.27.22/c2patool-v0.27.22-x86_64-unknown-linux-gnu.tar.gz"
          echo "6f138ad53da1a62f1cd6ee71c60727efa27d13b811f4c0ea8c2a8528968b358b  /tmp/c2patool.tar.gz" | sha256sum -c -
          tar -xzf /tmp/c2patool.tar.gz -C /tmp
          sudo install -m 0755 /tmp/c2patool/c2patool /usr/local/bin/c2patool

      - name: Install dependencies (frozen)
        run: bun install --frozen-lockfile

      # Upload tests (issue #50) run the real ffprobe/ffmpeg, as the
      # server image does.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Lint (Biome)
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Migrations match schema
        run: bun run db:check

      - name: Env schema matches .env.example
        run: bun run --filter @ai-content-studio/server env:check

      - name: Doc links (issue #82)
        run: bun run doc:check

      - name: Test
        run: bun test --isolate

      - name: Build web
        run: bun run build

  # Path-triggered (issue #79's AC): the contract suite already ran against
  # the fake as part of "ci"'s own `bun test --isolate`; this job re-runs
  # just that suite against a real, pinned, CPU-only ComfyUI, to prove the
  # fake tells the truth. See docs/ops/backend-kit.md's "ComfyUI version"
  # for the pin.
  comfyui-contract:
    needs: changes
    if: needs.changes.outputs.comfyui == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (frozen)
        run: bun install --frozen-lockfile

      - name: Install a pinned, CPU-only ComfyUI
        run: |
          git clone --depth 1 --branch v0.26.2 \
            https://github.com/comfyanonymous/ComfyUI.git /tmp/comfyui
          python3 -m venv /tmp/comfyui/venv
          /tmp/comfyui/venv/bin/pip install --upgrade pip
          /tmp/comfyui/venv/bin/pip install torch torchvision torchaudio \
            --index-url https://download.pytorch.org/whl/cpu
          /tmp/comfyui/venv/bin/pip install -r /tmp/comfyui/requirements.txt
          # TestSleep and ComfySwitchNode (this suite's own weightless
          # Workflows, issue #79's AC) are ComfyUI's own test-only nodes,
          # not shipped by default — install them as a custom node pack
          # the same way any other one is installed.
          cp -r /tmp/comfyui/tests/execution/testing_nodes/testing-pack \
            /tmp/comfyui/custom_nodes/testing-pack

      - name: Start ComfyUI (CPU-only)
        run: |
          nohup /tmp/comfyui/venv/bin/python /tmp/comfyui/main.py \
            --cpu --listen 127.0.0.1 --port 8189 \
            > /tmp/comfyui.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8189/system_stats > /dev/null && exit 0
            sleep 2
          done
          echo "ComfyUI never came up:"; cat /tmp/comfyui.log; exit 1

      - name: Run the comfyui contract suite against it
        env:
          COMFYUI_CONTRACT_URL: "http://127.0.0.1:8189"
        run: bun test apps/server/src/comfyui/contract.e2e.test.ts

      - name: ComfyUI's own log (only on failure, for debugging)
        if: failure()
        run: cat /tmp/comfyui.log

  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Workflow files (actionlint)
        # Mount the whole repo: actionlint needs the git project for
        # context. Any workflow file that does not parse or lint clean
        # fails the build, so a bad `if:` (or the like) cannot ship.
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint

      - name: ShellCheck
        run: >-
          shellcheck
          ops/studio/upgrade.sh
          ops/backup/backup.sh
          ops/backup/restore.sh
          scripts/upgrade-check.sh
          scripts/previous-release.sh
          scripts/retag-final.sh

      - name: Validate Caddyfile
        run: |
          docker run --rm -e DOMAIN=example.com \
            -v "$PWD/ops/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile

      - name: Compose config is valid
        run: |
          sed -e 's/^STUDIO_VERSION=$/STUDIO_VERSION=test/' \
              -e 's/^DOMAIN=$/DOMAIN=example.com/' \
              .env.example > .env
          docker compose config --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/amd64

  # Path-triggered (issue #77's AC): a real backup/restore round trip
  # against the actual image — a canary row survives a dropped database
  # and a wiped /data, and check-storage comes back clean afterwards.
  backup-roundtrip:
    needs: changes
    if: needs.changes.outputs.backup == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build image (loaded locally, tagged as the compose file expects)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ghcr.io/mysteryreloaded/ai-content-studio:test

      - name: Configure .env and backup.env
        run: |
          sed -e 's/^STUDIO_VERSION=$/STUDIO_VERSION=test/' \
              -e 's/^DOMAIN=$/DOMAIN=example.com/' \
              -e 's#^PUBLIC_URL=$#PUBLIC_URL=http://localhost:3000#' \
              -e 's/^GOOGLE_CLIENT_ID=$/GOOGLE_CLIENT_ID=test-client/' \
              -e 's/^GOOGLE_CLIENT_SECRET=$/GOOGLE_CLIENT_SECRET=test-secret/' \
              -e 's/^ADMIN_EMAILS=$/ADMIN_EMAILS=admin@example.com/' \
              -e 's#^SECRET_KEY=$#SECRET_KEY=4FRG13w9RuN5CeV10Lzfxl78MY+AJRJtGuKrBdYzgCY=#' \
              .env.example > .env
          mkdir -p restic-repo
          {
            echo "RESTIC_REPOSITORY=/restic-repo"
            echo "RESTIC_PASSWORD=test-password"
          } > backup.env

      - name: Start the stack
        run: docker compose up -d --wait studio postgres

      - name: Seed a canary row
        run: |
          docker compose exec -T postgres psql -U postgres -d ai_content_studio \
            -c "CREATE TABLE canary (v text); INSERT INTO canary VALUES ('round-trip');"

      - name: Initialize the restic repository
        run: docker compose --profile backup run --rm backup init

      - name: Back up
        run: ./ops/backup/backup.sh

      # Issue #77 CEO review: `docker compose run` gives each run a
      # random hostname, and restic's forget groups by host+paths, so a
      # second backup proves the fixed `hostname:` (docker-compose.yml)
      # keeps every snapshot in the one group retention prunes from.
      - name: Back up again, to check both snapshots share one host
        run: ./ops/backup/backup.sh

      - name: Snapshots share a single host
        run: |
          hosts=$(docker compose --profile backup run --rm backup snapshots --json \
            | jq -r '.[].hostname' | sort -u)
          echo "$hosts"
          [ "$(echo "$hosts" | wc -l)" -eq 1 ]

      - name: Simulate disaster (drop the database, wipe /data)
        run: |
          docker compose exec -T postgres psql -U postgres -d ai_content_studio \
            -c "DROP TABLE canary;"
          docker compose exec -T studio find /data -mindepth 1 -delete

      - name: Restore
        run: ./ops/backup/restore.sh

      - name: Canary row survived
        run: |
          docker compose exec -T postgres psql -U postgres -d ai_content_studio -tAc \
            "SELECT v FROM canary;" | grep -qx "round-trip"

      - name: check-storage reports nothing left to fix
        run: |
          docker compose exec -T studio \
            bun run apps/server/src/storage/check-storage.ts

      - name: Logs (only on failure, for debugging)
        if: failure()
        run: docker compose logs

  # Path-triggered (issue #82's AC): the upgrade check — a previous release
  # is booted with a fresh Postgres and /data, seeded through its own API
  # (scripts/seed.ts), stopped, and the candidate image (built from this
  # pull request) boots on the same database and /data: healthy, migrated,
  # check-storage clean. Skips itself when no final release exists yet
  # (v1.0.0 is the first one, so there is nothing to upgrade from).
  upgrade:
    needs: changes
    if: needs.changes.outputs.upgrade == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - uses: docker/setup-buildx-action@v3

      - name: Find the previous final release
        id: previous
        env:
          # The checkout's origin is the fork on a fork pull request;
          # the base repo's tags are the only ones that matter (public,
          # no token needed).
          REMOTE: "https://github.com/${{ github.repository }}"
        run: |
          previous=$(./scripts/previous-release.sh)
          if [ -z "$previous" ]; then
            echo "No final release yet; skipping the upgrade check (docs/ops/releasing.md)."
            echo "previous=" >> "$GITHUB_OUTPUT"
          else
            echo "previous=$previous" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        if: steps.previous.outputs.previous != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the previous release
        if: steps.previous.outputs.previous != ''
        run: |
          docker pull --platform linux/amd64 \
            ghcr.io/${{ github.repository }}:${{ steps.previous.outputs.previous }}

      - name: Build the candidate image (loaded locally, tagged as the check expects)
        if: steps.previous.outputs.previous != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository }}:upgrade-candidate

      - name: Upgrade check
        if: steps.previous.outputs.previous != ''
        env:
          PREVIOUS_IMAGE: ghcr.io/${{ github.repository }}:${{ steps.previous.outputs.previous }}
          CANDIDATE_IMAGE: ghcr.io/${{ github.repository }}:upgrade-candidate
        run: ./scripts/upgrade-check.sh

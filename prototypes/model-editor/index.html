<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Model Editor Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: an admin workspace, full height; each variant owns its own layout below the shared tokens. */
:root {
  --bg: #f4f6f5;
  --panel: #ffffff;
  --sunk: #edf1ef;
  --line: #d9e0dc;
  --line-strong: #b9c4be;
  --fg: #15201b;
  --muted: #5a6962;
  --faint: #8a9892;
  --accent: #0b7560;
  --accent-soft: #dcf0ea;
  --accent-fg: #ffffff;
  --err: #b9352a;
  --err-soft: #fbe6e3;
  --warn: #8f5c00;
  --warn-soft: #fbf0d9;
  --ok: #1d7f47;
  --ok-soft: #e0f3e7;
  --info: #2f5f9e;
  --dim: 0.38;
  --shadow: 0 1px 2px rgb(20 32 27 / 0.06), 0 8px 24px rgb(20 32 27 / 0.08);
  /* ComfyUI socket colours, used as small type markers on Node fields */
  --t-image: #3d8fd1;
  --t-video: #2b9e8f;
  --t-audio: #a066c8;
  --t-string: #6d8a3a;
  --t-int: #2e7bb3;
  --t-float: #b37a2e;
  --t-bool: #c0504d;
  --t-combo: #7a7f8a;
  --t-link: #9aa5a0;
  --bar-bg: #15201b;
  --bar-fg: #f4f6f5;
  --font-ui: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-head: "IBM Plex Sans Condensed", "IBM Plex Sans", "Arial Narrow", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101513; --panel: #171e1b; --sunk: #0d1210; --line: #27322d; --line-strong: #3a4842;
    --fg: #e4ebe7; --muted: #9aaaa2; --faint: #6f7e77; --accent: #3cc6a2; --accent-soft: #143a31; --accent-fg: #06120e;
    --err: #ff8577; --err-soft: #3a1a17; --warn: #f0b955; --warn-soft: #33270f; --ok: #63d394; --ok-soft: #12301f; --info: #8db8f0;
    --shadow: 0 1px 2px rgb(0 0 0 / 0.4), 0 8px 24px rgb(0 0 0 / 0.35);
    --t-image: #64b5f6; --t-video: #4fd1bf; --t-audio: #c597e8; --t-string: #a4c46a; --t-int: #6db3e6; --t-float: #e5a85a; --t-bool: #ef7d78; --t-combo: #a4a9b4; --t-link: #6f7e77;
    --bar-bg: #e4ebe7; --bar-fg: #101513;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101513; --panel: #171e1b; --sunk: #0d1210; --line: #27322d; --line-strong: #3a4842;
  --fg: #e4ebe7; --muted: #9aaaa2; --faint: #6f7e77; --accent: #3cc6a2; --accent-soft: #143a31; --accent-fg: #06120e;
  --err: #ff8577; --err-soft: #3a1a17; --warn: #f0b955; --warn-soft: #33270f; --ok: #63d394; --ok-soft: #12301f; --info: #8db8f0;
  --shadow: 0 1px 2px rgb(0 0 0 / 0.4), 0 8px 24px rgb(0 0 0 / 0.35);
  --t-image: #64b5f6; --t-video: #4fd1bf; --t-audio: #c597e8; --t-string: #a4c46a; --t-int: #6db3e6; --t-float: #e5a85a; --t-bool: #ef7d78; --t-combo: #a4a9b4; --t-link: #6f7e77;
  --bar-bg: #e4ebe7; --bar-fg: #101513;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 14px/1.45 var(--font-ui); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
#root { min-height: 100%; padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; font-family: var(--font-head); font-weight: 600; letter-spacing: 0.005em; }
h1 { font-size: 22px; line-height: 1.2; }
h2 { font-size: 18px; line-height: 1.25; }
h3 { font-size: 15px; }
h4 { font-size: 13px; }
p { margin: 0; }
a { color: var(--accent); }
code, .mono { font-family: var(--font-mono); font-size: 12.5px; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.small { font-size: 12.5px; }
.tnum { font-variant-numeric: tabular-nums; }
.eyebrow { font: 600 11px/1.2 var(--font-ui); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.row.nowrap { flex-wrap: nowrap; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack.tight { gap: 6px; }
.stack.loose { gap: 20px; }
.grow { flex: 1 1 auto; min-width: 0; }
.spacer { flex: 1; }
.prose { max-width: 66ch; }
.wrap-anywhere { overflow-wrap: anywhere; }

/* Controls */
button, input, select, textarea { font: inherit; color: inherit; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-strong); background: var(--panel); color: var(--fg); padding: 6px 12px; border-radius: var(--r); cursor: pointer; font-weight: 500; white-space: nowrap; line-height: 1.3; }
.btn:hover { border-color: var(--fg); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; border-color: var(--line); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.danger { color: var(--err); border-color: color-mix(in srgb, var(--err) 45%, var(--line)); }
.btn.warn { background: var(--warn); border-color: var(--warn); color: var(--panel); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); padding-inline: 8px; }
.btn.ghost:hover { color: var(--fg); background: var(--sunk); }
.btn.sm { padding: 3px 8px; font-size: 12.5px; }
.btn.xs { padding: 1px 6px; font-size: 12px; border-radius: 4px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.input, .select, .textarea { width: 100%; border: 1px solid var(--line-strong); background: var(--panel); border-radius: var(--r); padding: 6px 9px; min-width: 0; }
.textarea { resize: vertical; min-height: 64px; }
.input.mono { font-family: var(--font-mono); font-size: 12.5px; }
.input:focus, .select:focus, .textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.input.invalid { border-color: var(--err); }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > label, .field > .label { font-weight: 500; font-size: 13px; }
.field .hint { font-size: 12.5px; color: var(--muted); }
.field .err { font-size: 12.5px; color: var(--err); }
.fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
.check { display: inline-flex; gap: 8px; align-items: flex-start; cursor: pointer; }
.check input { margin-top: 3px; accent-color: var(--accent); }

.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--r); overflow: hidden; background: var(--panel); }
.seg button { border: 0; background: transparent; padding: 4px 9px; cursor: pointer; font-size: 12.5px; color: var(--muted); border-right: 1px solid var(--line); white-space: nowrap; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--fg); font-weight: 600; }
.seg.sm button { padding: 2px 7px; font-size: 12px; }

.switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
.switch .track { width: 34px; height: 20px; border-radius: 999px; background: var(--line-strong); position: relative; transition: background 0.15s; flex: none; }
.switch .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--panel); transition: transform 0.15s; box-shadow: 0 1px 2px rgb(0 0 0 / 0.25); }
.switch[aria-checked="true"] .track { background: var(--accent); }
.switch[aria-checked="true"] .track::after { transform: translateX(14px); }
.switch[aria-disabled="true"] { opacity: 0.55; cursor: not-allowed; }

/* Surfaces */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
.pad { padding: 16px; }
.pad-sm { padding: 10px 12px; }
.divider { height: 1px; background: var(--line); border: 0; margin: 0; }
.section-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.note { background: var(--sunk); border-radius: var(--r); padding: 9px 11px; font-size: 13px; color: var(--muted); }
.note strong { color: var(--fg); }
.callout { border: 1px solid var(--line); border-left: 3px solid var(--info); padding: 9px 12px; border-radius: 0 var(--r) var(--r) 0; font-size: 13px; background: var(--panel); }
.callout.warn { border-left-color: var(--warn); }
.callout.err { border-left-color: var(--err); }

/* Pills and dots */
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; padding: 1px 8px; border-radius: 999px; background: var(--sunk); color: var(--muted); white-space: nowrap; line-height: 1.6; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.err { background: var(--err-soft); color: var(--err); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.accent { background: var(--accent-soft); color: var(--accent); }
.pill.outline { background: transparent; border: 1px solid var(--line-strong); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; background: var(--t-link); }
.dot.t-IMAGE, .dot.t-image { background: var(--t-image); }
.dot.t-VIDEO, .dot.t-video { background: var(--t-video); }
.dot.t-AUDIO, .dot.t-audio { background: var(--t-audio); }
.dot.t-STRING, .dot.t-text, .dot.t-points { background: var(--t-string); }
.dot.t-INT, .dot.t-seed { background: var(--t-int); }
.dot.t-FLOAT, .dot.t-number { background: var(--t-float); }
.dot.t-BOOLEAN, .dot.t-toggle { background: var(--t-bool); }
.dot.t-COMBO, .dot.t-select { background: var(--t-combo); }
.dot.t-LINK { background: transparent; border: 1.5px solid var(--t-link); }
.count { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; font-size: 11px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; background: var(--sunk); color: var(--muted); }
.count.err { background: var(--err); color: var(--panel); }
.count.warn { background: var(--warn-soft); color: var(--warn); }

/* State chips (hidden / optional / required / fixed) */
.st { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; border-radius: 4px; padding: 1px 6px; white-space: nowrap; border: 1px solid transparent; line-height: 1.5; max-width: 100%; }
.st.hidden { color: var(--faint); }
.st.optional { border-color: var(--line-strong); color: var(--fg); }
.st.required { background: var(--accent); color: var(--accent-fg); font-weight: 600; }
.st.fixed { background: var(--sunk); color: var(--fg); font-family: var(--font-mono); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; }

/* Tables */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
table.t { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13px; }
table.t th { text-align: left; font-weight: 600; font-size: 12px; color: var(--muted); padding: 7px 10px; border-bottom: 1px solid var(--line); background: var(--panel); white-space: nowrap; }
table.t td { padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.t tr:last-child td { border-bottom: 0; }
table.t tr.clickable { cursor: pointer; }
table.t tr.clickable:hover td { background: var(--sunk); }
table.t tr.sel td { background: var(--accent-soft); }

/* Lists */
.list { display: flex; flex-direction: column; }
.list > .item { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-bottom: 1px solid var(--line); min-width: 0; }
.list > .item:last-child { border-bottom: 0; }
.list > button.item { background: transparent; border: 0; border-bottom: 1px solid var(--line); text-align: left; cursor: pointer; width: 100%; }
.list > button.item:hover { background: var(--sunk); }
.list > .item.sel { background: var(--accent-soft); }
.list > .item.dim { opacity: var(--dim); }

/* Issues */
.issue { display: flex; gap: 8px; align-items: flex-start; padding: 7px 10px; font-size: 13px; border-radius: var(--r); text-align: left; background: transparent; border: 0; width: 100%; cursor: pointer; }
.issue:hover { background: var(--sunk); }
.issue .ic { flex: none; margin-top: 2px; }
.issue.error .ic { color: var(--err); }
.issue.warning .ic { color: var(--warn); }

/* Overlays */
.scrim { position: fixed; inset: 0; background: rgb(10 16 13 / 0.45); z-index: 50; display: flex; align-items: flex-start; justify-content: center; padding: max(24px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); overflow-y: auto; }
.modal { background: var(--panel); border-radius: 10px; box-shadow: var(--shadow); width: min(720px, 100%); max-height: calc(100vh - 48px); display: flex; flex-direction: column; border: 1px solid var(--line); }
.modal.wide { width: min(980px, 100%); }
.modal > header { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.modal > .body { padding: 16px; overflow-y: auto; min-height: 0; }
.modal > footer { display: flex; gap: 8px; justify-content: flex-end; padding: 10px 16px; border-top: 1px solid var(--line); }
.sheet { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--panel); border-left: 1px solid var(--line); box-shadow: var(--shadow); z-index: 40; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
.sheet > header { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.sheet > .body { padding: 16px; overflow-y: auto; flex: 1; }
.pop-anchor { position: relative; }
.popover { position: absolute; z-index: 30; top: calc(100% + 4px); left: 0; background: var(--panel); border: 1px solid var(--line-strong); border-radius: 8px; box-shadow: var(--shadow); padding: 10px; min-width: 240px; }

/* Toasts */
.toasts { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); z-index: 70; display: flex; flex-direction: column; gap: 8px; max-width: min(420px, calc(100vw - 32px)); }
.toast { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--info); border-radius: 0 8px 8px 0; box-shadow: var(--shadow); padding: 10px 12px; font-size: 13px; }
.toast.ok { border-left-color: var(--ok); }
.toast.warn { border-left-color: var(--warn); }
.toast.err { border-left-color: var(--err); }

/* Drop zone, previews, progress */
.drop { border: 1.5px dashed var(--line-strong); border-radius: 10px; padding: 22px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; background: var(--panel); }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.upload-box { border: 1.5px dashed var(--line-strong); border-radius: var(--r); padding: 10px 12px; display: flex; align-items: center; gap: 10px; background: var(--sunk); cursor: pointer; font-size: 13px; color: var(--muted); width: 100%; text-align: left; }
.upload-box.filled { border-style: solid; color: var(--fg); background: var(--panel); }
.progress { height: 6px; background: var(--sunk); border-radius: 3px; overflow: hidden; }
.progress > div { height: 100%; background: var(--accent); transition: width 0.4s ease; }
.poster { aspect-ratio: 16 / 9; max-width: 100%; border-radius: 8px; background: radial-gradient(circle at 30% 35%, #ff4fa3 0, transparent 38%), radial-gradient(circle at 72% 60%, #2bd9c9 0, transparent 40%), linear-gradient(135deg, #1a1033, #0b2a2e); display: flex; align-items: flex-end; padding: 10px; color: #f4f6f5; font: 12px var(--font-mono); position: relative; overflow: hidden; }
.poster::after { content: "▶"; position: absolute; inset: 0; display: grid; place-items: center; font-size: 30px; color: rgb(255 255 255 / 0.85); }

/* User page preview */
.userpage { border: 1px solid var(--line); border-radius: 10px; background: var(--bg); padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.userpage .uf { display: flex; flex-direction: column; gap: 4px; }
.userpage .uf label { font-size: 13px; font-weight: 500; display: flex; gap: 6px; align-items: baseline; }

/* Prototype chrome: floating variant switcher */
.proto-bar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); z-index: 80; display: flex; align-items: center; gap: 4px; background: var(--bar-bg); color: var(--bar-fg); border-radius: 999px; padding: 5px; box-shadow: 0 6px 24px rgb(0 0 0 / 0.3); font-size: 13px; max-width: calc(100vw - 24px); }
.proto-bar button { background: transparent; border: 0; color: inherit; cursor: pointer; border-radius: 999px; padding: 6px 10px; font-weight: 600; }
.proto-bar button:hover { background: rgb(127 127 127 / 0.25); }
.proto-bar .lbl { padding: 0 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.proto-bar select { background: transparent; color: inherit; border: 1px solid rgb(127 127 127 / 0.5); border-radius: 999px; padding: 4px 8px; font-size: 12px; max-width: 190px; }
.proto-bar select option { color: #15201b; background: #fff; }
.proto-tag { font: 600 10px/1 var(--font-ui); letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.7; padding-left: 10px; }

/* ---------- Variant A: sections ---------- */
.va { min-height: calc(100vh - 76px); display: flex; flex-direction: column; }
.va-head { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--panel); border-bottom: 1px solid var(--line); padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.va-body { flex: 1; display: grid; grid-template-columns: 200px minmax(0, 1fr) 300px; gap: 0; }
.va-nav { border-right: 1px solid var(--line); padding: 14px 8px; display: flex; flex-direction: column; gap: 2px; background: var(--panel); }
.va-nav button { display: flex; align-items: center; gap: 8px; text-align: left; border: 0; background: transparent; padding: 7px 10px; border-radius: var(--r); cursor: pointer; color: var(--muted); font-weight: 500; }
.va-nav button:hover { background: var(--sunk); color: var(--fg); }
.va-nav button[aria-current="true"] { background: var(--accent-soft); color: var(--fg); }
.va-main { padding: 20px max(16px, env(safe-area-inset-left, 0px)) 20px 20px; min-width: 0; display: flex; flex-direction: column; gap: 16px; }
.va-rail { border-left: 1px solid var(--line); padding: 14px 12px; display: flex; flex-direction: column; gap: 12px; background: var(--panel); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
.va-rail .sticky { position: sticky; top: 76px; display: flex; flex-direction: column; gap: 12px; }
.grid-wrap { overflow: auto; max-height: calc(100vh - 230px); border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
table.mg { border-collapse: separate; border-spacing: 0; font-size: 12.5px; }
table.mg th, table.mg td { border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); padding: 5px 6px; background: var(--panel); }
table.mg thead th { position: sticky; top: 0; z-index: 3; vertical-align: bottom; min-width: 112px; max-width: 132px; text-align: left; font-weight: 600; }
table.mg thead th button { all: unset; cursor: pointer; display: block; }
table.mg thead th button:hover .mname { text-decoration: underline; }
table.mg th.rowh { position: sticky; left: 0; z-index: 2; text-align: left; min-width: 190px; font-weight: 500; }
table.mg thead th.rowh { z-index: 4; }
table.mg td.cell { text-align: left; }
table.mg td.cell > .pop-anchor > button { all: unset; cursor: pointer; display: block; width: 100%; min-height: 22px; border-radius: 4px; }
table.mg td.cell > .pop-anchor > button:hover { outline: 1px solid var(--accent); outline-offset: 1px; }
table.mg tr.outrow td, table.mg tr.outrow th { background: var(--sunk); }
table.mg td.has-err { box-shadow: inset 0 0 0 2px var(--err); }
.mname { display: block; line-height: 1.25; white-space: normal; }

/* ---------- Variant B: Workflow inspector ---------- */
.vb { height: calc(100vh - 76px - env(safe-area-inset-bottom, 0px)); min-height: 520px; display: flex; flex-direction: column; }
.vb-head { background: var(--panel); border-bottom: 1px solid var(--line); padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 8px; }
.vb-modes { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 2px; }

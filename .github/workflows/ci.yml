name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_content_studio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/ai_content_studio
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install dependencies (frozen)
        run: bun install --frozen-lockfile

      - name: Lint (Biome)
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Migrations match schema
        run: bun run db:check

      - name: Env schema matches .env.example
        run: bun run --filter @ai-content-studio/server env:check

      - name: Test
        run: bun test --isolate

      - name: Build web
        run: bun run build

  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: ShellCheck
        run: shellcheck ops/studio/upgrade.sh

      - name: Compose config is valid
        run: |
          sed -e 's/^STUDIO_VERSION=$/STUDIO_VERSION=test/' \
              -e 's/^DOMAIN=$/DOMAIN=example.com/' \
              .env.example > .env
          docker compose config --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/amd64

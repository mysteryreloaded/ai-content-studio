# The final release (issue #82): re-tags the latest passing release
# candidate's digest (the vX.Y.Z-rc.N with the highest N, the one its
# Release issue was checked off against) as vX.Y.Z and `latest` through
# the registry's manifest API. It never builds — the final tag points at
# the exact digest the candidate gate already ran. Candidate tags
# (vX.Y.Z-rc.N) match this trigger too but skip the job; their own gate
# is .github/workflows/release-rc.yml. See docs/ops/releasing.md.
name: Final release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  retag:
    if: ${{ !contains(github.ref_name, '-rc.') }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      # The script checks that the candidate's own gate (release-rc.yml)
      # ran green before re-tagging; the run lookup needs actions: read.
      actions: read

    steps:
      - uses: actions/checkout@v5

      - name: Re-tag the passing candidate's digest (no build)
        env:
          TAG: ${{ github.ref_name }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/retag-final.sh
